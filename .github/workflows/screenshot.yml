name: Hourly CWA Screenshot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm ci
          npx playwright install chromium --with-deps
      - run: node capture.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
